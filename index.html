<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Biomechanical Hand Digital Twin Framework</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght=300;400&family=Bebas+Neue&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0c0c10; --panel: #10101a; --border: #1a1a28;
    --accent: #e8dcc8; --dim: #3a3a50; --muted: #4a4a65;
  }
  body { background: var(--bg); color: var(--accent); font-family: 'DM Mono', monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.15em; color: var(--accent); }
  .tagline { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; }
  .specs { display: flex; gap: 24px; }
  .spec { text-align: center; }
  .spec-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--accent); line-height: 1; }
  .spec-lbl { font-size: 0.5rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

  .main { display: flex; flex: 1; overflow: hidden; }

  #canvas-wrap {
    flex: 1; position: relative;
    background: radial-gradient(ellipse at 35% 55%, #111820 0%, #0c0c10 65%);
  }
  canvas { display: block; width: 100% !important; height: 100% !important; }

  .loading-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 5; transition: opacity 0.8s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .load-ring {
    width: 40px; height: 40px; border: 1px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; }

  .hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 0.55rem; color: var(--muted); letter-spacing: 0.12em;
    text-transform: uppercase; pointer-events: none;
    border: 1px solid var(--border); padding: 6px 14px;
  }

  /* Panel */
  .panel {
    width: 260px; background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
  }
  .panel-top {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem; letter-spacing: 0.2em;
    color: var(--muted); text-transform: uppercase;
  }
  .panel-scroll { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
  .panel-scroll::-webkit-scrollbar { width: 6px; } 
  .panel-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); } 
  .panel-scroll::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; } 
  .panel-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); } 

  .section-label {
    padding: 12px 20px 6px;
    font-size: 0.55rem; letter-spacing: 0.2em;
    color: var(--dim); text-transform: uppercase;
  }

  .joint-row { padding: 5px 20px; }

  .joint-name {
    font-size: 0.6rem; color: var(--muted);
    letter-spacing: 0.05em; margin-bottom: 5px;
    display: block;
  }

  input[type=range] {
    -webkit-appearance: none; width: 100%;
    height: 1px; background: var(--dim);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.5);
    box-shadow: 0 0 8px rgba(232,220,200,0.4);
  }

  .divider { height: 1px; background: var(--border); margin: 8px 20px; }

  .panel-bottom { padding: 16px 20px; border-top: 1px solid var(--border); }
  .reset-btn {
    width: 100%; padding: 9px;
    background: transparent; border: 1px solid var(--dim);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.15em;
    cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* عناصر الاتصال بالعتاد الخارجي */
  #connect-btn { margin-top: 8px; }
  #connect-btn.connected { border-color: #6ee7a8; color: #6ee7a8; }
  #rawData {
    font-size: 0.55rem; color: var(--muted); margin-top: 8px;
    white-space: pre-wrap; word-break: break-all; max-height: 80px;
    overflow-y: auto; line-height: 1.4;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Biomechanical Hand Model Framework</div>
    <div class="tagline">High-Fidelity Digital Twin · Kinematic Calibration · MJCF Compatible</div>
  </div>
  <div class="specs">
    <div class="spec"><div class="spec-num">29</div><div class="spec-lbl">Meshes</div></div>
    <div class="spec"><div class="spec-num">25</div><div class="spec-lbl">Actuators</div></div>
    <div class="spec"><div class="spec-num">XML</div><div class="spec-lbl">Output</div></div>
  </div>
</header>

<div class="main">
  <div id="canvas-wrap">
    <div class="loading-overlay" id="loading">
      <div class="load-ring"></div>
      <div class="load-text">Loading Calibrated Bone Meshes</div>
    </div>
    <canvas id="c"></canvas>
    <div class="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right drag to pan</div>
  </div>

  <div class="panel">
    <div class="panel-top">
      <div class="panel-title">Kinematic Control Panel</div>
    </div>
    <div class="panel-scroll" id="controls"></div>
    <div class="panel-bottom">
      <button class="reset-btn" id="reset-btn">↺ &nbsp;Reset Hand Telemetry</button>
      <button class="reset-btn" id="connect-btn">🔌 &nbsp;Connect Hardware</button>
      <pre id="rawData">—</pre>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.001, 100);
camera.position.set(0.1, -0.3, 0.8);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(-0.27, -0.05, 0.82);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xfff5e8, 2.0);
key.position.set(-0.5, -1, 2); scene.add(key);
const fill = new THREE.DirectionalLight(0xd0e8ff, 0.5);
fill.position.set(1, 0.5, 0.5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.3);
rim.position.set(0.3, 1, -0.5); scene.add(rim);

// هيكلة شجرة العظام والمفاصل مأخوذة بالملي من ملف XML
const BONES = [
  { name:'Ulna_bone_r', file:'Ulna_bone_r.stl', parent:null, joint:null },
  { name:'Radius_bone_r', file:'Radius_bone_r.stl', parent:'Ulna_bone_r', joint:'Forearm_Rotation', axis:[-0.003,-0.045,-0.217], pos:[-0.240,0.035,1.075] },

  // سلسلة مفاصل المعصم المتداخلة (Flexion ثم Deviation) لمنع تداخل المحاور
  { name:'Wrist_Flex_Helper', file:null, parent:'Radius_bone_r', joint:'Wrist_Flexion', axis:[1,0,0], pos:[-0.269,-0.012,0.860] },
  { name:'Scaphoid_bone_r', file:'Scaphoid_bone_r.stl', parent:'Wrist_Flex_Helper', joint:'Wrist_Deviation', axis:[0,1,0], pos:[-0.269,-0.012,0.860] },

  { name:'Lunate_bone_r', file:'Lunate_bone_r.stl', parent:'Scaphoid_bone_r', joint:null },
  { name:'Triquetrum_bone_r', file:'Triquetrum_bone_r.stl', parent:'Scaphoid_bone_r', joint:null },
  { name:'Pisiform_bone_r', file:'Pisiform_bone_r.stl', parent:'Scaphoid_bone_r', joint:null },
  { name:'Trapezoid_bone_r', file:'Trapezoid_bone_r.stl', parent:'Scaphoid_bone_r', joint:null },
  { name:'Second_metacarpal_bone_r', file:'Second_metacarpal_bone_r.stl', parent:'Trapezoid_bone_r', joint:null },
  { name:'Proximal_2', file:'Proximal_phalanx_of_second_finger_of_hand_r.stl', parent:'Second_metacarpal_bone_r', joint:'Index_MCP', axis:[-1.995,0,0.600], pos:[-0.294735,-0.039462,0.769426] },
  { name:'Middle_2', file:'Middle_phalanx_of_second_finger_of_hand_r.stl', parent:'Proximal_2', joint:'Index_PIP', axis:[-0.595,0,0.240], pos:[-0.308460,-0.054918,0.735318] },
  { name:'Distal_2', file:'Distal_phalanx_of_second_finger_of_hand_r.stl', parent:'Middle_2', joint:'Index_DIP', axis:[-1,0,0.300], pos:[-0.314926,-0.071994,0.718768] },
  { name:'Capitate_bone_r', file:'Capitate_bone_r.stl', parent:'Scaphoid_bone_r', joint:null },
  { name:'Third_metacarpal_bone_r', file:'Third_metacarpal_bone_r.stl', parent:'Capitate_bone_r', joint:null },
  { name:'Proximal_3', file:'Proximal_phalanx_of_third_finger_of_hand_r.stl', parent:'Third_metacarpal_bone_r', joint:'Middle_MCP', axis:[-1.995,0,0.300], pos:[-0.274274,-0.037800,0.770436] },
  { name:'Middle_3', file:'Middle_phalanx_of_third_finger_of_hand_r.stl', parent:'Proximal_3', joint:'Middle_PIP', axis:[-1.500,0,0.250], pos:[-0.278637,-0.061843,0.732092] },
  { name:'Distal_3', file:'Distal_phalanx_of_third_finger_of_hand_r.stl', parent:'Middle_3', joint:'Middle_DIP', axis:[-1,0,0.200], pos:[-0.285050,-0.080670,0.710360] },
  { name:'Hamate_bone_r', file:'Hamate_bone_r.stl', parent:'Scaphoid_bone_r', joint:null },
  { name:'Fourth_metacarpal_bone_r', file:'Fourth_metacarpal_bone_r.stl', parent:'Hamate_bone_r', joint:null },
  { name:'Proximal_4', file:'Proximal_phalanx_of_fourth_finger_of_hand_r.stl', parent:'Fourth_metacarpal_bone_r', joint:'Ring_MCP', axis:[-1,0,0], pos:[-0.256271,-0.039199,0.776223] },
  { name:'Middle_4', file:'Middle_phalanx_of_fourth_finger_of_hand_r.stl', parent:'Proximal_4', joint:'Ring_PIP', axis:[-1,0,0.050], pos:[-0.258853,-0.059882,0.737901] },
  { name:'Distal_4', file:'Distal_phalanx_of_fourth_finger_of_hand_r.stl', parent:'Middle_4', joint:'Ring_DIP', axis:[-1,0,0.050], pos:[-0.258276,-0.080550,0.717740] },
  { name:'Fifth_metacarpal_bone_r', file:'Fifth_metacarpal_bone_r.stl', parent:'Hamate_bone_r', joint:null },
  { name:'Proximal_5', file:'Proximal_phalanx_of_fifth_finger_of_hand_r.stl', parent:'Fifth_metacarpal_bone_r', joint:'Little_MCP', axis:[-3.5,0,-0.550], pos:[-0.236051,-0.041957,0.783481] },
  { name:'Middle_5', file:'Middle_phalanx_of_fifth_finger_of_hand_r.stl', parent:'Proximal_5', joint:'Little_PIP', axis:[-0.995,0.020,-0.200], pos:[-0.234037,-0.056174,0.751353] },
  { name:'Distal_5', file:'Distal_phalanx_of_fifth_finger_of_hand_r.stl', parent:'Middle_5', joint:'Little_DIP', axis:[-0.989,-0.050,-0.100], pos:[-0.229620,-0.070720,0.735228] },
  { name:'Trapezium_bone_r', file:'Trapezium_bone_r.stl', parent:'Scaphoid_bone_r', joint:null },
  { name:'First_metacarpal_bone_r', file:'First_metacarpal_bone_r.stl', parent:'Trapezium_bone_r', joint:'Thumb_CMC_flex_ext', axis:[-0.61626,0.78754,0.0], pos:[-0.285638,-0.027264,0.842696] },
  { name:'Proximal_1', file:'Proximal_phalanx_of_first_finger_of_hand_r.stl', parent:'First_metacarpal_bone_r', joint:'Thumb_MCP', axis:[0,-1,0.65], pos:[-0.314,-0.049,0.813] },
  { name:'Distal_1', file:'Distal_phalanx_of_first_finger_of_hand_r.stl', parent:'Proximal_1', joint:'Thumb_IP', axis:[0,-1,0.788], pos:[-0.326,-0.062,0.788] },
];

const SECTIONS = [
  { label:'Forearm & Wrist', joints:[
    { name:'Forearm Rotation', id:'Forearm_Rotation', min:-150, max:1 },
    { name:'Wrist Flexion / Extension', id:'Wrist_Flexion', min:-60, max:60 },
    { name:'Wrist Deviation', id:'Wrist_Deviation', min:-15, max:30 },
  ]},
  { label:'Thumb Joints', joints:[
    { name:'Thumb CMC Flexion', id:'Thumb_CMC_flex_ext', min:-15, max:45 },
    { name:'Thumb MCP Hinge', id:'Thumb_MCP', min:0, max:45 },
    { name:'Thumb IP Extension', id:'Thumb_IP', min:0, max:80 },
  ]},
  { label:'Index Finger', joints:[
    { name:'Index MCP Hinge', id:'Index_MCP', min:0, max:90 },
    { name:'Index PIP Joint', id:'Index_PIP', min:0, max:100 },
    { name:'Index DIP Flex', id:'Index_DIP', min:0, max:80 },
  ]},
  { label:'Middle Finger', joints:[
    { name:'Middle MCP Hinge', id:'Middle_MCP', min:0, max:90 },
    { name:'Middle PIP Joint', id:'Middle_PIP', min:0, max:100 },
    { name:'Middle DIP Flex', id:'Middle_DIP', min:0, max:80 },
  ]},
  { label:'Ring Finger', joints:[
    { name:'Ring MCP Hinge', id:'Ring_MCP', min:0, max:90 },
    { name:'Ring PIP Joint', id:'Ring_PIP', min:0, max:100 },
    { name:'Ring DIP Flex', id:'Ring_DIP', min:0, max:80 },
  ]},
  { label:'Little Finger', joints:[
    { name:'Little MCP Hinge', id:'Little_MCP', min:0, max:90 },
    { name:'Little PIP Joint', id:'Little_PIP', min:0, max:100 },
    { name:'Little DIP Flex', id:'Little_DIP', min:0, max:80 },
  ]},
];

const pivots = {}, boneGroups = {};
const root = new THREE.Group();
scene.add(root);

for (const bone of BONES) {
  const g = new THREE.Group();
  boneGroups[bone.name] = g;
  if (bone.joint && bone.axis && bone.pos) {
    const pivot = new THREE.Group();
    pivot.position.set(...bone.pos);
    pivot.userData.axis = new THREE.Vector3(...bone.axis).normalize();
    pivots[bone.joint] = pivot;
    const off = new THREE.Group();
    off.position.set(-bone.pos[0], -bone.pos[1], -bone.pos[2]);
    off.add(g); pivot.add(off);
    (bone.parent ? boneGroups[bone.parent] : root).add(pivot);
  } else {
    (bone.parent ? boneGroups[bone.parent] : root).add(g);
  }
}

function setAngle(id, deg) {
  const p = pivots[id];
  if (p) p.setRotationFromAxisAngle(p.userData.axis, THREE.MathUtils.degToRad(deg));
}

/* ============================================================
   الاتصال بالعتاد الخارجي (Web Serial API)
   - كل مستخدم يتصل بعتاده الخاص مباشرة من متصفحه، بدون سيرفر وسيط.
   - هذه المرحلة تكتفي بعرض البيانات الخام فقط، بدون ربطها بالمفاصل بعد.
   - يعمل فقط على Chrome / Edge (سطح المكتب أساسًا).
   ============================================================ */
let serialPort, serialReader;
const connectBtn = document.getElementById('connect-btn');
const rawDataEl = document.getElementById('rawData');

async function connectHardware() {
  if (!('serial' in navigator)) {
    rawDataEl.textContent = 'المتصفح لا يدعم Web Serial API. استخدم Chrome أو Edge.';
    return;
  }
  try {
    serialPort = await navigator.serial.requestPort();
    await serialPort.open({ baudRate: 115200 });

    const decoder = new TextDecoderStream();
    serialPort.readable.pipeTo(decoder.writable);
    serialReader = decoder.readable.getReader();

    connectBtn.textContent = '● Connected';
    connectBtn.classList.add('connected');
    rawDataEl.textContent = 'متصل، بانتظار بيانات...';
    readSerialLoop();
  } catch (err) {
    rawDataEl.textContent = 'فشل الاتصال: ' + err;
  }
}

async function readSerialLoop() {
  try {
    while (true) {
      const { value, done } = await serialReader.read();
      if (done) break;
      if (value) rawDataEl.textContent = value;
      // الخطوة القادمة (لاحقًا): تحليل value وتحويله لزوايا،
      // ثم استدعاء setAngle(jointId, angleDeg) لكل مفصل.
    }
  } catch (err) {
    rawDataEl.textContent = 'انقطع الاتصال: ' + err;
    connectBtn.textContent = '🔌 Connect Hardware';
    connectBtn.classList.remove('connected');
  }
}

connectBtn.addEventListener('click', connectHardware);

const mat = new THREE.MeshStandardMaterial({ color:0xd8c8b0, roughness:0.45, metalness:0.08 });
const loader = new STLLoader();
let loaded = 0;

await Promise.all(BONES.map(b => new Promise(res => {
  if (!b.file) { res(); return; } // تخطي المجموعات المساعدة بدون ملفات
  loader.load(`assets/${b.file}`, geo => {
    geo.computeVertexNormals();
    boneGroups[b.name].add(new THREE.Mesh(geo, mat.clone()));
    loaded++; res();
  }, undefined, () => { loaded++; res(); });
})));

document.getElementById('loading').classList.add('hidden');

const container = document.getElementById('controls');
const sliders = {};

for (const sec of SECTIONS) {
  const lbl = document.createElement('div');
  lbl.className = 'section-label';
  lbl.textContent = sec.label;
  container.appendChild(lbl);

  for (const joint of sec.joints) {
    const row = document.createElement('div');
    row.className = 'joint-row';

    const name = document.createElement('span');
    name.className = 'joint-name';
    name.textContent = joint.name;

    const slider = document.createElement('input');
    slider.type = 'range'; slider.min = 0; slider.max = 100;
    slider.value = joint.min < 0 ? Math.round((-joint.min/(joint.max-joint.min))*100) : 0;
    sliders[joint.id] = { el: slider, min: joint.min, max: joint.max };

    slider.addEventListener('input', () => {
      const deg = joint.min + (joint.max - joint.min) * slider.value / 100;
      setAngle(joint.id, deg);

      for (const f of ['Index','Middle','Ring','Little']) {
        if (joint.id===`${f}_DIP`) { const p=deg*0.7; setAngle(`${f}_PIP`,p); setAngle(`${f}_MCP`,p*0.3); }
        else if (joint.id===`${f}_PIP`) setAngle(`${f}_MCP`,deg*0.3);
      }
      if (joint.id==='Thumb_IP') setAngle('Thumb_MCP',deg*0.3);
      if (joint.id==='Thumb_MCP') setAngle('Thumb_CMC_flex_ext',deg*0.2);
    });

    row.appendChild(name);
    row.appendChild(slider);
    container.appendChild(row);
  }

  const div = document.createElement('div');
  div.className = 'divider';
  container.appendChild(div);
}

document.getElementById('reset-btn').addEventListener('click', () => {
  for (const [id, {el, min, max}] of Object.entries(sliders)) {
    setAngle(id, 0);
    el.value = min < 0 ? Math.round((-min/(max-min))*100) : 0;
  }
});

function resize() {
  const w = document.getElementById('canvas-wrap').clientWidth;
  const h = document.getElementById('canvas-wrap').clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
